<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Study Notes{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9f5; color: #212c2a; font: 17px/1.55 "Source Sans 3", system-ui, sans-serif; }
    header { background: #183f36; color: white; }
    nav, main { max-width: 62rem; margin: auto; padding: 1.1rem 1.5rem; }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: 1.2rem; }
    nav a, nav button { color: white; }
    nav form { margin: 0; }
    .brand { margin-right: auto; font: bold 1.5rem Georgia, serif; text-decoration: none; }
    main { padding-top: 2rem; }
    h1, h2 { font-family: "Source Serif 4", Georgia, serif; line-height: 1.2; }
    h1 { font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 500; margin: .35rem 0 1.25rem; }
    h2 { margin: 0 0 1rem; font-size: 1.6rem; }
    a { color: #215b49; text-underline-offset: .16em; }
    label { display: block; font-weight: 600; }
    input, textarea { border: 1px solid #858e86; background: white; padding: .6rem; border-radius: .25rem; width: 100%; font: inherit; }
    td, th { text-align: left; padding: .3rem 1.2rem .3rem 0; }
    textarea { height: 9rem; }
    button { font: inherit; cursor: pointer; padding: .55rem 1rem; background: #215b49; color: white; border: 0; border-radius: .3rem; }
    nav button { background: transparent; padding: 0; text-decoration: underline; }
    .card { background: white; border: 1px solid #d5d9d1; border-radius: .5rem; padding: 1.3rem; margin-bottom: 1.1rem; }
    .columns { display: grid; grid-template-columns: 1.15fr 1fr; gap: 1.5rem; align-items: start; }
    .narrow { max-width: 36rem; }
    .helptext, .muted, time { font-size: .9rem; color: #4f6059; }
    .errorlist { color: #8d291b; font-weight: 600; }
    .search { display: flex; gap: .5rem; margin-top: .4rem; }
    .entries { list-style: none; margin: 1rem 0 0; padding: 0; }
    .entries li { border-top: 1px solid #d5d9d1; padding: .8rem 0; }
    .bodytext { white-space: pre-wrap; overflow-wrap: anywhere; }
    h1, li { overflow-wrap: anywhere; }
    @media(max-width: 680px) { .columns { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header><nav aria-label="Main navigation">
  <a class="brand" href="{% url 'notebook' %}">Study Notes</a>
  {% if user.is_authenticated %}
    <a href="{% url 'notebook' %}">Notebook</a>
    <a href="{% url 'guides' %}">Guides</a>
    <a href="{% url 'account' %}">Account</a>
    <a href="{% url 'activity' %}">Activity</a>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sign out</button></form>
  {% endif %}
</nav></header>
<main>{% block content %}{% endblock %}</main>
</body></html>
